<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Settimana II — Giorno I — Esercizio</title>
		<link rel="stylesheet" href="assets/css/style.css" />
		<script type="module" src="assets/js/script.js"></script>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
      <button dataValue="7">7</button>
      <button dataValue="8">8</button>
      <button dataValue="9">9</button>
      <button dataValue="/">/</button>

      <button dataValue="4">4</button>
      <button dataValue="5">5</button>
      <button dataValue="6">6</button>
      <button dataValue="*">*</button>

      <button dataValue="1">1</button>
      <button dataValue="2">2</button>
      <button dataValue="3">3</button>
      <button dataValue="-">-</button>

      <button dataValue="0">0</button>
      <button doAction="clearDisplay">C</button>
      <button doAction="calculateResult">=</button>
      <button dataValue="+">+</button>
    </div>
  </div>

  









	</body>
</html>
